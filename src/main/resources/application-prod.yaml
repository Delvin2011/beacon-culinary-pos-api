spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}

# Swagger UI and the OpenAPI document are off in production (go-live checklist item 4).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# T0-1: one JSON object per line on stdout (Logstash field names), collected by Azure.
logging:
  structured:
    format:
      console: logstash
