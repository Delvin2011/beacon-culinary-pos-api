spring:
  application:
    name: beacon-culinary-api
  jwt:
    secret: ${JWT_SECRET}
    accessTokenExpiration: 900 # 15m
    refreshTokenExpiration: 604800 # 7d
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  server:
    port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# GRV VAT handling: the standard VAT rate, snapshotted onto every GRV line.
vat:
  standard-rate: 0.15

# Reports R3: where Z numbering starts. Close Day ignores earlier days (they can't be closed and
# don't block later ones). Set to the go-live day; empty = every earlier day must be closed first.
reports:
  close-day:
    first-trading-day: ${CLOSE_DAY_FIRST_TRADING_DAY:2026-10-12}
