spring:
  application:
    name: beacon-culinary-api
  jwt:
    secret: ${JWT_SECRET}
    accessTokenExpiration: 900 # 15m
    refreshTokenExpiration: 604800 # 7d
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Public board: minutes a DONE order stays on the board before it drops off (0 = straight away).
board:
  done-display-minutes: ${BOARD_DONE_DISPLAY_MINUTES:10}

# GRV VAT handling: the standard VAT rate, snapshotted onto every GRV line.
vat:
  standard-rate: 0.15

# Reports R3: where Z numbering starts. Close Day ignores earlier days (they can't be closed and
# don't block later ones). Set to the go-live day; empty = every earlier day must be closed first.
reports:
  close-day:
    first-trading-day: ${CLOSE_DAY_FIRST_TRADING_DAY:2026-10-12}

# Back-office dashboard. Thresholds (no settings screen yet). Times are quoted: YAML 1.1 reads an
# unquoted 12:30 as a number.
dashboard:
  variance:
    threshold: 50.00
  voidRefund:
    watchPercent: 3.0
  slowMeal:
    thresholdPercent: 25
    afterTime: "12:30"
  openingHours: "06:00-15:00"
  cache:
    enabled: true
  # One flag per stage the dashboard reads; a section whose stage is off is left out of the layout.
  features:
    complimentary: true
    categories: true
    barStation: true
    lightMealStock: true
    signOff: true
    reportDefinitions: true
    accountReports: true

# WS1-1 login protection. Phase 1 is monitor only: attempts are recorded and flagged, never blocked.
# Settings and defaults: docs/2026-11-11-login-protection.md.
security:
  login-protection:
    mode: ${LOGIN_PROTECTION_MODE:monitor}
    # Reverse proxies whose X-Forwarded-For is trusted (IPs or CIDRs). Empty until the Azure ingress is confirmed.
    trusted-proxies: []
    retention-days: 90
