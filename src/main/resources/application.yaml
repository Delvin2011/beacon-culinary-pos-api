spring:
  application:
    name: beacon-culinary-api
  jwt:
    secret: ${JWT_SECRET}
    accessTokenExpiration: 900 # 15m
    refreshTokenExpiration: 604800 # 7d
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
  flyway:
    enabled: true
    # T0-7: db/baseline (the B116 baseline for new customer databases) is added by app.flyway.include-baseline
    # (below; on in the prod profile), so an empty dev or test database still replays every migration.
    locations: classpath:db/migration
    # T0-7: off, so a database that has tables but no migration history fails loudly instead of being marked
    # as migrated (docs/2026-11-22-new-customer-database.md).
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:8080}

# Refresh and device cookies (RefreshCookies, DeviceCookies). secure defaults to true (the dev profile turns it off).
# T1-L0: path-prefix is the path a proxy removes in front of this API (/api for the local stack and Front Door),
# so the refresh cookie's path is the address the browser calls. Empty when the API is called directly.
cookie:
  path-prefix: ${COOKIE_PATHPREFIX:}

# T0-1 logging (docs/2026-11-19-logging.md). Text on the console here and in dev; JSON lines in prod.
# Change a level by environment variable, e.g. LOGGING_LEVEL_COM_BEACONCULINARY_API_DEVICES=DEBUG.
logging:
  level:
    root: INFO
    com.beaconculinary: INFO
  pattern:
    # Adds the request id (or the job name) and user id to each text line.
    level: "%5p [%X{requestId:-}%X{jobName:-}] [%X{userId:-}]"
  # Paths with no request log line (Ant patterns): /health polls and the SSE streams.
  request:
    skip-paths: ${LOGGING_REQUEST_SKIP_PATHS:/health,/**/stream}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# T0-2 site locale: business time zone and currency (docs/2026-11-19-site-locale.md). Checked at
# startup. The SQL report views assume South Africa Standard Time, so the zone must be one that
# maps to it (e.g. Africa/Johannesburg) or the app refuses to start.
site:
  time-zone: ${SITE_TIME_ZONE:Africa/Johannesburg}
  currency-code: ${SITE_CURRENCY_CODE:ZAR}
  currency-symbol: ${SITE_CURRENCY_SYMBOL:R}

# Public board: minutes a DONE order stays on the board before it drops off (0 = straight away).
board:
  done-display-minutes: ${BOARD_DONE_DISPLAY_MINUTES:10}

# O1: when true, POST /orders needs clientOrderId and POST /orders/{id}/adjustments needs
# clientRequestId (400 otherwise). Off until every till sends them.
pos:
  require-client-order-id: ${POS_REQUIRE_CLIENT_ORDER_ID:false}
  # O2 tills and POS sessions (TillProperties): docs/2026-11-17-o2-tills-shifts-api-contract.md section 2.
  tills:
    max-active: ${POS_TILLS_MAXACTIVE:3}
    require-registered: ${POS_TILLS_REQUIREREGISTERED:false}
  session:
    idle-lock-minutes: ${POS_SESSION_IDLELOCKMINUTES:5}
    idle-expiry-minutes: ${POS_SESSION_IDLEEXPIRYMINUTES:30}
  # O3 offline foundation (OfflineProperties): docs/2026-11-17-o3-offline-foundation-api-contract.md section 2.
  # grant-signing-key: Base64, at least 32 bytes, required when enabled; a dedicated secret, never JWT_SECRET.
  offline:
    enabled: ${POS_OFFLINE_ENABLED:false}
    max-offline-hours: ${POS_OFFLINE_MAXOFFLINEHOURS:6}
    warn-offline-hours: ${POS_OFFLINE_WARNOFFLINEHOURS:5}
    accounts-enabled: ${POS_OFFLINE_ACCOUNTSENABLED:true}
    account-cap: ${POS_OFFLINE_ACCOUNTCAP:150.00}
    grant-max-hours: ${POS_OFFLINE_GRANTMAXHOURS:18}
    status-stale-minutes: ${POS_OFFLINE_STATUSSTALEMINUTES:10}
    grant-signing-key: ${POS_OFFLINE_GRANTSIGNINGKEY:}
    grant-key-id: ${POS_OFFLINE_GRANTKEYID:k1}
    # O4: optional previous key, verify-only, for rotating grant-signing-key without refusing older grants.
    grant-previous-signing-key: ${POS_OFFLINE_GRANTPREVIOUSSIGNINGKEY:}
    grant-previous-key-id: ${POS_OFFLINE_GRANTPREVIOUSKEYID:}

# GRV VAT handling: the standard VAT rate, snapshotted onto every GRV line.
vat:
  standard-rate: 0.15

# T0-4a: the platform fallback for the business name on statement reports, used only when the receipt
# settings have none. Blank by default so no customer's name is printed on another's reports; onboarding
# sets the name in the receipt settings.
app:
  business:
    name: ${APP_BUSINESS_NAME:}
  # T0-6a: the address staff open the frontend at, for invite links ({base}/invite#t=<token>). Blank:
  # the API returns no link and the frontend builds it from its own address. Per customer in T1.
  public-base-url: ${APP_PUBLIC_BASE_URL:}
  # T0-7: true adds classpath:db/baseline to Flyway's locations (FlywayBaselineLocation): an empty database
  # starts from the B116 baseline without demo data, and a database built from it validates. Off here, so an
  # empty dev or test database replays every migration; on in the prod profile. Needs Flyway enabled (the dev
  # profile turns it off). docs/2026-11-22-new-customer-database.md
  flyway:
    include-baseline: ${APP_FLYWAY_INCLUDEBASELINE:false}

# T0-6a: default for the site setting auth.invites.expiry-hours (1-720).
auth:
  invites:
    expiry-hours: ${AUTH_INVITES_EXPIRYHOURS:72}

# Reports R3: where Z numbering starts. Close Day ignores earlier days (they can't be closed and
# don't block later ones). Set to the go-live day; empty = every earlier day must be closed first.
reports:
  close-day:
    first-trading-day: ${CLOSE_DAY_FIRST_TRADING_DAY:2026-10-12}

# Back-office dashboard. Thresholds (no settings screen yet). Times are quoted: YAML 1.1 reads an
# unquoted 12:30 as a number.
dashboard:
  variance:
    threshold: 50.00
  voidRefund:
    watchPercent: 3.0
  slowMeal:
    thresholdPercent: 25
    afterTime: "12:30"
  openingHours: "06:00-15:00"
  cache:
    enabled: true
  # One flag per stage the dashboard reads; a section whose stage is off is left out of the layout.
  features:
    complimentary: true
    categories: true
    barStation: true
    lightMealStock: true
    signOff: true
    reportDefinitions: true
    accountReports: true

# WS1-1 login protection. Phase 1 is monitor only: attempts are recorded and flagged, never blocked.
# Settings and defaults: docs/2026-11-11-login-protection.md.
security:
  login-protection:
    mode: ${LOGIN_PROTECTION_MODE:monitor}
    # Reverse proxies whose X-Forwarded-For is trusted (IPs or CIDRs). Empty until the Azure ingress is confirmed.
    trusted-proxies: []
    retention-days: 90
  # WS1-1b POS till registration. Off by default; "off" is quoted because YAML reads a bare off as false.
  # Settings and defaults: docs/2026-11-13-device-registration-api-contract.md.
  device-trust:
    # Placeholders so the .env file (spring-dotenv) can set these locally; on Azure, real environment
    # variables work either way. The quotes keep a bare off from being read as false.
    mode: "${SECURITY_DEVICETRUST_MODE:off}"
    multi-browser-enabled: ${SECURITY_DEVICETRUST_MULTIBROWSERENABLED:false}
    require-serial: ${SECURITY_DEVICETRUST_REQUIRESERIAL:true}
    idle-expiry-days: 90
    cookie-max-age-days: 365
    last-seen-interval: 5m
    reauth-max-age: 30m
  # T0-6a: refuse every sign-in by the seeded demo accounts (users.is_demo). Always on under the prod
  # profile whatever this says; off by default elsewhere so development and the tests can use them.
  demo-accounts:
    block-sign-in: ${SECURITY_DEMOACCOUNTS_BLOCKSIGNIN:false}
