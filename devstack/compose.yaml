# T1-L0 local stack: the production layout on a developer's machine (docs/2026-11-23-local-stack.md).
#
#   https://<customer>.pos.localhost/api/*  -> caddy -> backend:8080 (the /api prefix removed)   ~ Front Door -> backend
#   https://<customer>.pos.localhost/*      -> caddy -> frontend:3000 (or a dev server on the host) ~ Front Door -> frontend
#   backend -> sql:1433 (or the developer's own SQL Server)                                        ~ Azure SQL
#
# Run it through devstack/scripts/up.ps1, which reads devstack/stack.env (git-ignored) and works out the values
# below that have no default. Values come from stack.env or the environment, never from this file.
name: ${STACK_NAME:-beacon-devstack}

networks:
  stack:
    ipam:
      config:
        # Fixed, so the backend can trust exactly this range as its proxy (SECURITY_LOGINPROTECTION_TRUSTEDPROXIES).
        - subnet: 172.30.0.0/24

volumes:
  sql-data:
  caddy-data:
  caddy-config:

services:
  sql:
    # Only with SQL_MODE=container (the "sql" profile). Developer edition, for development only.
    profiles: [sql]
    image: mcr.microsoft.com/mssql/server:2022-CU16-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      # Server default; every database is also created with an explicit COLLATE (scripts/_common.ps1).
      MSSQL_COLLATION: SQL_Latin1_General_CP1_CI_AS
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD:?set SQL_PASSWORD in devstack/stack.env}
    ports:
      # Loopback only: the host's own tools (the new-customer script, sqlcmd) reach it; the network doesn't.
      - "127.0.0.1:${SQL_HOST_PORT:-14333}:1433"
    volumes:
      - sql-data:/var/opt/mssql
    networks: [stack]
    healthcheck:
      # The password goes to sqlcmd through SQLCMDPASSWORD, inside the container, never on a command line.
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    image: beacon-devstack/backend:local
    depends_on:
      sql:
        condition: service_healthy
        required: false
    environment:
      # Single-customer mode (until T1-1 to T1-3): one database, chosen by ACTIVE_CUSTOMER.
      SPRING_DATASOURCE_URL: "jdbc:sqlserver://${SQL_SERVER:-sql}:${SQL_PORT:-1433};databaseName=${ACTIVE_CUSTOMER:?set ACTIVE_CUSTOMER};encrypt=true;trustServerCertificate=true"
      SPRING_DATASOURCE_USERNAME: ${SQL_USER:-sa}
      SPRING_DATASOURCE_PASSWORD: ${SQL_PASSWORD:?set SQL_PASSWORD in devstack/stack.env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in devstack/stack.env}
      # Both kinds of customer database validate with the baseline location: full history (beaconculinary)
      # ignores it, a T0-7 database (testcustomer) needs it. Every database exists before the backend starts.
      APP_FLYWAY_INCLUDEBASELINE: "true"
      # Caddy removes /api, as Front Door will: the refresh cookie's path must still be /api/auth/refresh.
      COOKIE_PATHPREFIX: /api
      # The only proxy is Caddy, on the stack network: its X-Forwarded-For and X-Forwarded-Host are believed.
      SECURITY_LOGINPROTECTION_TRUSTEDPROXIES: 172.30.0.0/24
      LOGIN_PROTECTION_MODE: ${LOGIN_PROTECTION_MODE:-monitor}
      CORS_ALLOWED_ORIGINS: "https://${ACTIVE_CUSTOMER}.pos.localhost${PUBLIC_PORT_SUFFIX:-}"
      APP_PUBLIC_BASE_URL: "https://${ACTIVE_CUSTOMER}.pos.localhost${PUBLIC_PORT_SUFFIX:-}"
    extra_hosts:
      # For SQL_MODE=host: the developer's own SQL Server.
      - "host.docker.internal:host-gateway"
    networks: [stack]
    # No published port: as in production, the backend is reached only through the proxy.

  frontend:
    # Only with FRONTEND_MODE=container (the "frontend" profile). Built from the frontend repository's container
    # file (T1-L0-FE). Until T1-0d the API address is baked in at build time, so there is one build per customer.
    profiles: [frontend]
    build:
      context: ${FRONTEND_REPO:-../../beacon-culinary-pos-front-end}
      args:
        NEXT_PUBLIC_AUTH_API_URL: "https://${ACTIVE_CUSTOMER}.pos.localhost${PUBLIC_PORT_SUFFIX:-}/api"
    image: beacon-devstack/frontend:${ACTIVE_CUSTOMER}
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    networks: [stack]

  caddy:
    image: caddy:2.8.4
    depends_on: [backend]
    ports:
      - "127.0.0.1:${HTTPS_PORT:-443}:443"
      - "127.0.0.1:${HTTP_PORT:-80}:80"
    environment:
      ACTIVE_HOST: "${ACTIVE_CUSTOMER}.pos.localhost"
      # frontend:3000 (the container), host.docker.internal:3000 (npm run dev on the host, hot reload), or
      # unset-frontend:3000 when there is no frontend (Caddy then answers 502 for pages; /api still works).
      FRONTEND_UPSTREAM: ${FRONTEND_UPSTREAM:-frontend:3000}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Keeps Caddy's local certificate authority, so its root is trusted once, not after every restart.
      - caddy-data:/data
      - caddy-config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [stack]
